baseURL = "https://freshwatersystemsworkshop.org/"
locale = "en-US"
title = "Freshwater Systems Science Workshop"
theme = "hugo-winston-theme"

# Build into the docs folder, which GitHub Pages publishes (Settings > Pages: branch main, folder /docs)
publishDir = "docs"

# Recommended for production so all links use the full domain:
canonifyURLs = true

[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'home'
    url = '/'
    weight = 1
  [[menu.main]]
    name = "people"
    identifier = "people"
    weight = 2
    url = "/people/"
  [[menu.main]]
    name = "workshops"
    identifier = "workshops"
    weight = 3
    url = "/workshops/"
  [[menu.main]]
    name = "papers"
    identifier = "papers"
    weight = 4
    url = "/papers/"
  [[menu.main]]
    name = "contact"
    identifier = "contact"
    weight = 5
    url = "/contact/"

[params]
  google_analytics_id = ""
  twitter_handle = "@xander_huggins"
  showAuthorOnHomepage = false
  showAuthorOnPosts = false
  showIntroContentOnHomepage = true
  showPostsOnHomepage = false
  usePaginationOnHomepage = false
  sortPostsByDateOldestFirst = false
  addDot = false
  addFrame = true
  highlightColor = '#001852'
  baseColor = "#ffffff"
  baseOffsetColor = "#ADC5FF"
  headingColor = "#001852"
  textColor = "#001852"
  dotColor = "#ADC5FF"
  enableGoogleFonts = true 
  googleFontsUrl = "https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
  fontFamilyHeading = "Poppins"
  fontFamilyParagraph = "Helvetica"
  fontFamilyMonospace = "monospace"

[minify]
  minifyOutput = true

# Lets a page put {.class-name} on the line under a paragraph or list to style it (used for the highlight box)
[markup.goldmark.parser.attribute]
  block = true
